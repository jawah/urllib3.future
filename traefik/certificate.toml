[[tls.certificates]]
  certFile = "/certs/httpbin.local.pem"
  keyFile = "/certs/httpbin.local.pem.key"

[[tls.certificates]]
  certFile = "/certs/mtls/server.pem"
  keyFile = "/certs/mtls/server.key"

[tls.options.mtls.clientAuth]
  caFiles = ["/certs/mtls/client.pem"]
  clientAuthType = "RequireAndVerifyClientCert"

[http.middlewares.mtls-client-cert.passTLSClientCert]
  pem = true
