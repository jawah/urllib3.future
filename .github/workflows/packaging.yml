name: CI for Packaging Check

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-packaging-${{ github.ref_name }}
  cancel-in-progress: true

jobs:

  mixed-env-a:
    name: Ensure PTH support
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25

    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.7", "3.13", "pypy3.11" ]
        os:
          - macos-15
          - windows-2022
          - ubuntu-22.04
        exclude:
          - python-version: "3.7"
            os: macos-15
          - python-version: "pypy3.11"
            os: macos-15
          - python-version: "pypy3.11"
            os: windows-2022

    steps:
      - name: "Checkout repository"
        uses: "actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0"
        with:
          persist-credentials: false

      - name: "Setup Python"
        uses: "actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97"
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: "Install legacy urllib3"
        run: pip install urllib3

      - name: "Install newer package"
        run: pip install .

      - name: "Test concurrent first startup"
        run: >-
          python -S -c 'import subprocess, sys; processes = [subprocess.Popen([sys.executable, "-c", "import urllib3, urllib3_future; assert urllib3.__version__ == urllib3_future.__version__; assert urllib3.__path__[0].endswith(\"urllib3\")"]) for _ in range(32)]; assert all(process.wait() == 0 for process in processes)'

      - name: "Install legacy urllib3 last"
        run: pip install --force-reinstall --no-deps urllib3

      - name: "Test concurrent repair"
        run: >-
          python -S -c 'import subprocess, sys; processes = [subprocess.Popen([sys.executable, "-c", "import urllib3, urllib3_future; assert urllib3.__version__ == urllib3_future.__version__; assert urllib3.__path__[0].endswith(\"urllib3\")"]) for _ in range(32)]; assert all(process.wait() == 0 for process in processes)'

      - name: "Test repair with constrained file descriptors"
        if: matrix.python-version == 'pypy3.11'
        run: |
          pip install --force-reinstall --no-deps urllib3
          ulimit -n 64
          python -S -c 'import subprocess, sys; processes = [subprocess.Popen([sys.executable, "-c", "import urllib3, urllib3_future; assert urllib3.__version__ == urllib3_future.__version__"]) for _ in range(16)]; assert all(process.wait() == 0 for process in processes)'

      - name: "Test execution"
        run: python -c "import urllib3; urllib3.PoolManager().urlopen('GET', 'https://httpbingo.org/get')"

      - name: "Assert clean install"
        run: python -c "import urllib3; assert not hasattr(urllib3, '_base_connection.py'); assert hasattr(urllib3, 'backend')"

      - name: "Install both packages in the user site"
        if: runner.os == 'Linux' && matrix.python-version == '3.13'
        run: |
          pip install --user --force-reinstall --no-deps .
          pip install --user --force-reinstall --no-deps urllib3

      - name: "Test concurrent user-site repair"
        if: runner.os == 'Linux' && matrix.python-version == '3.13'
        run: >-
          python -S -c 'import subprocess, sys; processes = [subprocess.Popen([sys.executable, "-c", "import site, urllib3, urllib3_future; assert urllib3.__version__ == urllib3_future.__version__; assert urllib3.__path__[0].startswith(site.getusersitepackages())"]) for _ in range(32)]; assert all(process.wait() == 0 for process in processes)'


  mixed-env-bypass:
    name: Ensure PTH Bypass support
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25

    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.7", "3.13" ]
        os:
          - macos-15
          - windows-2022
          - ubuntu-22.04
        exclude:
          - python-version: "3.7"
            os: macos-15

    steps:
      - name: "Checkout repository"
        uses: "actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0"
        with:
          persist-credentials: false

      - name: "Setup Python"
        uses: "actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97"
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: "Install newer package"
        run: pip install .
        env:
          URLLIB3_NO_OVERRIDE: "1"

      - name: "Install legacy urllib3"
        run: pip install urllib3

      - name: "Test execution"
        run: python -c "import urllib3; urllib3.PoolManager().urlopen('GET', 'https://httpbingo.org/get')"

      - name: "Assert clean install"
        run: python -c "import urllib3; assert hasattr(urllib3, '_base_connection'); assert not hasattr(urllib3, 'backend')"
